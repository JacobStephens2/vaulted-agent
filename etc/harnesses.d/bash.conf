# Reached as: va bash
#
# Interactive shell with the harness manifest injected. Extra argv is
# appended, so `va bash ./script.sh` runs that script in the same env.
# workdir=caller: the directory you launched from.

bin      = $HOME/.local/bin
manifest = full.env.tpl
labels   = no
keep     = SSH_AUTH_SOCK
workdir  = caller
command  = bash
