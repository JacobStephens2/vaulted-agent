# Reached as: claude-conductor
# Prompts for approval on each tool call.
# workdir=caller: run where you launched so sessions / --resume match.
# Resume:  va claude --resume <uuid>   or   va claude resume <uuid>

bin      = $HOME/.local/bin
manifest = full.env.tpl
labels   = yes
workdir  = caller
command  = claude --permission-mode auto
