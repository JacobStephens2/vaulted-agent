# Reached as: kimi-conductor
# Kimi Code CLI (https://www.kimi.com/code/en) — binary: `kimi`
# workdir=caller: sessions are stored per working directory under ~/.kimi-code/
# Resume:  va kimi --continue
#          va kimi --session <id>   (or -S / --resume / -r)
#          va kimi resume <id>      (normalized to --resume)
#
# --auto is Kimi's fully autonomous permission mode: the agent decides for
# itself and never stops to ask. Its tiers are manual (default, prompts on
# every tool call), --yolo (auto-approves tool calls, may still ask you
# questions), and --auto. This matches claude.conf's --permission-mode auto,
# so both harnesses run unattended by default. Drop the flag here for a
# harness that should stop and ask, and note that static `deny` rules in
# ~/.kimi-code/config.toml still apply under --auto.
#
# Credentials (issue #68): Kimi does **not** read custom OpenAI-compatible
# provider keys from the process environment. Put the key in
# ~/.kimi-code/config.toml (api_key = "…"). A vault manifest / alias here is a
# silent no-op for those providers. Keep empty.env so doctor does not pretend
# injection is doing work. KIMI_API_KEY is env-readable only for kimi's own
# built-in provider. A future file-render backend may write an ephemeral
# config for tools in this class (see MIGRATION.md / docs).

bin      = $HOME/.local/bin
backend  = plainfile
manifest = empty.env
labels   = no
workdir  = caller
command  = kimi --auto
