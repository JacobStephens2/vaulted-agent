# Reached as: kimi-conductor
# Kimi Code CLI (https://www.kimi.com/code/en) — binary: `kimi`
# workdir=caller: sessions are stored per working directory under ~/.kimi-code/
# Resume:  va kimi --continue
#          va kimi --session <id>   (or -S / --resume / -r)
#          va kimi resume <id>      (normalized to --resume)
#
# --auto is Kimi's fully autonomous permission mode: the agent decides for
# itself and never stops to ask. Its tiers are manual (default, prompts on
# every tool call), --yolo (auto-approves tool calls, may still ask you
# questions), and --auto. This matches claude.conf's --permission-mode auto,
# so both harnesses run unattended by default. Drop the flag here for a
# harness that should stop and ask, and note that static `deny` rules in
# ~/.kimi-code/config.toml still apply under --auto.
#
# Credentials (issue #70): kimi reads OpenAI-compatible provider keys from the
# process environment (OPENAI_API_KEY by provider *type*, not name). Day-one is
# empty.env; install rewires to the vault refs file like claude/codex/grok.
#
# Kimi Code 0.33+ currently ships an auth-gate regression that ignores
# process.env in default print mode (kimi-code#2745; fix PR #2746, not yet in a
# release as of this note). The env line below restores vault inject on those
# builds. Remove it once your kimi includes #2746 (0.32 never needed it).
# Probes that established env inject used print mode (`kimi -p`); interactive
# TUI was not the verification path.
#
# Fireworks (or any non-OpenAI vault name) under a shared manifest: map the
# vault key onto OPENAI_API_KEY for this harness only (issue #66). Confirmed
# for OpenAI-compatible type selection generally; Fireworks itself was not
# re-probed in #70:
# alias    = OPENAI_API_KEY = FIREWORKS_AI_API_KEY

bin      = $HOME/.local/bin
backend  = plainfile
manifest = empty.env
labels   = no
workdir  = caller
# Temporary until kimi ships MoonshotAI/kimi-code#2746 — delete this line then.
env      = KIMI_CODE_LEGACY_FLAG = 1
command  = kimi --auto
