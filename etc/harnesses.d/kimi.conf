# Reached as: kimi-conductor
# Kimi Code CLI (https://www.kimi.com/code/en) — binary: `kimi`
# workdir=caller: sessions are stored per working directory under ~/.kimi-code/
# Resume:  va kimi --continue
#          va kimi --session <id>   (or -S / --resume / -r)
#          va kimi resume <id>      (normalized to --resume)
#
# --auto is Kimi's fully autonomous permission mode: the agent decides for
# itself and never stops to ask. Its tiers are manual (default, prompts on
# every tool call), --yolo (auto-approves tool calls, may still ask you
# questions), and --auto. This matches claude.conf's --permission-mode auto,
# so both harnesses run unattended by default. Drop the flag here for a
# harness that should stop and ask, and note that static `deny` rules in
# ~/.kimi-code/config.toml still apply under --auto.

# Kimi does NOT read provider credentials from its environment, so this harness
# ships with empty.env rather than a vault manifest (issue #68). Pointing it at
# one is not an error and not a warning you can act on -- the launcher resolves
# every variable, injects them, and kimi ignores all of them. Auth then fails
# for reasons that look nothing like a launcher problem.
#
# For a custom openai-compatible provider (Fireworks, Together, a local vLLM),
# kimi wants the literal key in ~/.kimi-code/config.toml:
#
#   [providers.fireworks]
#   type    = "openai"
#   api_key = "fw_…"        # <- read from here, never from the environment
#
# Confirmed against 0.34.0: ${VAR} in api_key is sent verbatim rather than
# expanded, there is no api_key_env key, and a [providers.<name>.env] sub-table
# does not reach the process environment either. KIMI_API_KEY *is* read from the
# environment, but only for kimi's own built-in provider.
#
# So `alias` does not help here. It renames a variable in the child env, and the
# child never looks there.
bin      = $HOME/.local/bin
manifest = empty.env
labels   = no
workdir  = caller
command  = kimi --auto
