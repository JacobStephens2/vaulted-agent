# Reached as: kimi-conductor
# Kimi Code CLI (https://www.kimi.com/code/en) — binary: `kimi`
# workdir=caller: sessions are stored per working directory under ~/.kimi-code/
# Resume:  va kimi --continue
#          va kimi --session <id>   (or -S / --resume / -r)
#          va kimi resume <id>      (normalized to --resume)
#
# --auto is Kimi's fully autonomous permission mode: the agent decides for
# itself and never stops to ask. Its tiers are manual (default, prompts on
# every tool call), --yolo (auto-approves tool calls, may still ask you
# questions), and --auto. This matches claude.conf's --permission-mode auto,
# so both harnesses run unattended by default. Drop the flag here for a
# harness that should stop and ask, and note that static `deny` rules in
# ~/.kimi-code/config.toml still apply under --auto.
#
# Credentials (issue #70): kimi *does* read OpenAI-compatible provider keys from
# the process environment (OPENAI_API_KEY by provider *type*, not name). Day-one
# is empty.env; install rewires to the vault refs file like claude/codex/grok.
#
# Kimi Code 0.33–0.34 have an auth-gate regression (kimi-code#2745; fix #2746)
# that looks like "env-blind". The launcher sets KIMI_CODE_LEGACY_FLAG=1 in the
# child env for kimi so vault inject works until a fixed kimi is universal.
# Kimi 0.32 and post-#2746 work without that flag.
#
# Fireworks (or any non-OpenAI vault name) under a shared manifest: map the
# vault key onto OPENAI_API_KEY for this harness only (issue #66):
# alias    = OPENAI_API_KEY = FIREWORKS_AI_API_KEY

bin      = $HOME/.local/bin
backend  = plainfile
manifest = empty.env
labels   = no
workdir  = caller
command  = kimi --auto
