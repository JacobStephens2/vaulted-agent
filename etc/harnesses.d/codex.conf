# Reached as: codex-conductor
# A narrower manifest: this harness never sees production write credentials.
# workdir=caller: run where you launched so sessions / `codex resume` match.
# Resume:  va codex resume <uuid>   or   va codex --resume <uuid>

bin      = $HOME/.local/bin
manifest = limited.env.tpl
labels   = no
workdir  = caller
command  = codex -s danger-full-access -a on-request
