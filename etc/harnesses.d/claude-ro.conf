# Reached as: claude-ro-conductor
# The same agent as claude.conf against read-only credentials. A separate file
# and a separate symlink, so the sudoers file can say who may launch it with
# credentials that can change production and who gets this instead.

bin      = $HOME/.local/bin
manifest = readonly.env.tpl
labels   = yes
workdir  = caller
command  = claude --permission-mode auto
