# Reached as: grok-conductor
# Read-only credentials only. `keep` lets the agent forward an SSH agent
# socket, which the scrub would otherwise remove.
# workdir=caller: run in the directory you launched from so `grok --resume`
# finds cwd-scoped sessions.

bin      = $HOME/.grok/bin
manifest = readonly.env.tpl
labels   = no
keep     = SSH_AUTH_SOCK
workdir  = caller
command  = grok
