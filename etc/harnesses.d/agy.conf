# Reached as: va agy
# Antigravity CLI (https://antigravity.google/docs/cli/) - binary: `agy`.
# workdir=caller: AGY conversations are scoped to the directory launched from.
# Continue: va agy --continue (or -c)
# Select:   va agy --conversation <uuid>

bin      = $HOME/.local/bin
backend  = plainfile
manifest = empty.env
labels   = no
workdir  = caller
command  = agy
