name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux assets are static musl builds on purpose. A glibc-linked
          # binary inherits a version dependency from whatever libc the runner
          # happened to have — ubuntu-latest is 24.04, so std's process-spawn
          # path picks up pidfd_spawnp/pidfd_getpid and stamps a GLIBC_2.39
          # verneed entry. That entry is not marked weak, so ld.so refuses to
          # load the binary on any older host (RHEL/Rocky 9 = 2.34, Debian 12 =
          # 2.36, Ubuntu 22.04 = 2.35): "version `GLIBC_2.39' not found".
          # Static musl has no libc floor at all. Safe for this binary because
          # nothing resolves users or groups in-process (gid_for_user shells
          # out to `id`), so musl's static-NSS limitation does not apply.
          # No musl-tools needed: rustc links these targets self-contained.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: vaulted-agent-x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: vaulted-agent-aarch64-unknown-linux-musl
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: vaulted-agent-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: vaulted-agent-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # @rev selects the toolchain. A commit SHA does not, and this pin is on
      # master, whose action has no default, so the input stays stable.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install cross (linux aarch64)
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Verify the linux asset has no libc floor
        if: contains(matrix.target, 'linux')
        run: |
          bin="target/${{ matrix.target }}/release/vaulted-agent"
          if readelf -l "$bin" | grep -q INTERP; then
            echo "::error::$bin is dynamically linked; expected a static musl build"
            readelf -d "$bin" | head -20
            exit 1
          fi
          if readelf -V "$bin" 2>/dev/null | grep -q 'GLIBC_'; then
            echo "::error::$bin carries glibc version deps: $(readelf -V "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tr '\n' ' ')"
            exit 1
          fi
          echo "ok: static, no glibc version dependency"

      - name: Stage asset
        run: |
          bin="target/${{ matrix.target }}/release/vaulted-agent"
          cp "$bin" "${{ matrix.asset }}"
          tar -czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            Rust runtime release. See MIGRATION.md for Bash → Rust notes.

            Install pin:
            ```bash
            VAULTED_AGENT_VERSION=${{ github.ref_name }} curl -fsSL https://vaultedagent.com/install.sh | bash
            ```
