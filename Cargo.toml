[package]
name = "vaulted-agent"
version = "0.4.18"
edition = "2021"
description = "Launch AI coding agents with vault-resolved secrets in-process"
license = "MIT"
readme = "README.md"
repository = "https://github.com/JacobStephens2/vaulted-agent"

[[bin]]
name = "vaulted-agent"
path = "src/main.rs"

[dependencies]
rpassword = "7.4"
serde_json = "1.0"
uuid = { version = "1.11", features = ["v5"] }

[dev-dependencies]
tempfile = "3.14"
