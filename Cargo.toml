[package]
name = "vaulted-agent"
version = "0.4.0"
edition = "2021"
description = "Launch AI coding agents with vault-resolved secrets in-process"
license = "MIT"
readme = "README.md"
repository = "https://github.com/JacobStephens2/vaulted-agent-launcher"

[[bin]]
name = "vaulted-agent"
path = "src/main.rs"

[dependencies]
rpassword = "7"
serde_json = "1"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
tempfile = "3"
